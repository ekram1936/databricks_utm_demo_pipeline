# Declarative pipeline (DLT-style) - serverless only, Free Edition
resources:
  pipelines:
    manufacturing_etl_pipeline:
      name: "manufacturing-etl-pipeline-${bundle.target}"
      catalog: "${var.catalog_name}"
      schema: "${var.schema_name}"
      serverless: true
      photon: true
      development: true
      continuous: false
      channel: "CURRENT"

      libraries:
        - notebook:
            path: ../notebooks/run_pipeline.py
        - file:
            path: ../src/pipeline/bronze_ingest.py
        - file:
            path: ../src/pipeline/silver_transform.py
        - file:
            path: ../src/pipeline/gold_aggregate.py

      configuration:
        source_path: "/Volumes/${var.catalog_name}/${var.schema_name}/raw"
        pipelines.enableTrackHistory: "true"
