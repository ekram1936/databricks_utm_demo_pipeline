resources:
  jobs:
    manufacturing_main_pipeline_job:
      name: "manufacturing-main-pipeline-${bundle.target}"
      tags:
        project: manufacturing-etl
        owner: ekram.hossain

      tasks:
        - task_key: bronze_ingest
          pipeline_task:
            pipeline_id: ${resources.pipelines.manufacturing_bronze_pipeline.id}
          max_retries: 0

        - task_key: silver_transform
          depends_on:
            - task_key: bronze_ingest
          pipeline_task:
            pipeline_id: ${resources.pipelines.manufacturing_silver_pipeline.id}
          max_retries: 0

        - task_key: gold_aggregate
          depends_on:
            - task_key: silver_transform
          pipeline_task:
            pipeline_id: ${resources.pipelines.manufacturing_gold_pipeline.id}
          max_retries: 0

        - task_key: sentiment_analysis
          depends_on:
            - task_key: gold_aggregate
          spark_python_task:
            python_file: ../src/pipeline/sentiment_analysis.py
            parameters:
              - "--catalog"
              - "${var.catalog_name}"
              - "--schema"
              - "${var.schema_name}"
          environment_key: default
          max_retries: 0

      environments:
        - environment_key: default
          spec:
            environment_version: "2"
            dependencies:
              - -r ../requirements.txt

      schedule:
        quartz_cron_expression: "0 0 3 * * ?"
        timezone_id: "Europe/Berlin"
        pause_status: PAUSED

      queue:
        enabled: true
